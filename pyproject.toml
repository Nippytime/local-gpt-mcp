[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-gpt-mcp"
version = "0.1.0"
description = "Consent-first local MCP desktop companion"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "playwright==1.65.2",
    "PyJWT[crypto]==2.15.1",
    "Pillow==13.0.0; sys_platform == 'win32'",
    "pywin32==312; sys_platform == 'win32'",
    "psutil>=7.1.0; sys_platform == 'win32'",
    "uiautomation==2.0.29; sys_platform == 'win32'",
]

[project.scripts]
local-gpt-mcp = "local_gpt_mcp.cli:main"
local-gpt-agent = "local_gpt_mcp.agent.cli:main"
local-gpt-issuer = "local_gpt_mcp.gateway.issuer_keys:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"local_gpt_mcp.gateway" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "ci", "workflow", "tests"]
strict = true
ignore_missing_imports = true
exclude = "(?x)^(.venv|artifacts|build|dist)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
