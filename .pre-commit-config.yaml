minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: local-gpt-mcp-fast
        name: Fast deterministic gates
        entry: ./ci/run fast
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: local-gpt-mcp-pr
        name: PR unit/integration/build gates
        entry: ./ci/run pr
        language: system
        pass_filenames: false
        stages: [pre-push]
